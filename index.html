<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070504">
<title>Wedding Nehemia & Fanomezana</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403}
body{font-family:Georgia,"Times New Roman",serif}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;background:
radial-gradient(circle at 50% 38%,rgba(196,138,38,.20),transparent 25%),
linear-gradient(180deg,#130d08 0%,#070504 58%,#020201 100%)}
.content{position:absolute;z-index:3;left:50%;top:47%;width:min(76vw,720px);transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.emblem{position:relative;width:120px;height:88px;margin:0 auto 8px}
.crown{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:27px;color:#e3b14c;text-shadow:0 0 15px rgba(255,207,91,.5)}
.ring{position:absolute;top:27px;width:57px;height:57px;border-radius:50%;border:5px solid #dfad42;box-shadow:0 0 18px rgba(255,211,102,.18)}
.r1{left:17px}.r2{right:17px;border-color:#eceef1}
.heart{position:absolute;left:50%;top:48px;transform:translateX(-50%);color:#e1ad43;font-size:22px}
.kicker{color:#f0eee8;font-family:Arial,sans-serif;font-weight:500;font-size:clamp(10px,2.7vw,16px);letter-spacing:.38em;margin:8px 0 12px}
.title{margin:0;color:transparent;font-weight:500;font-size:clamp(45px,11vw,88px);line-height:.92;background:linear-gradient(105deg,#88530c,#dba53a 20%,#fff0a2 40%,#fff 49%,#d29a2f 67%,#ffe9a0 83%,#84500b);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 7px 15px rgba(0,0,0,.65))}
.names{margin-top:23px;color:#e5b65a;font-size:clamp(18px,4.8vw,37px);line-height:1.18;text-shadow:0 4px 14px #000}
.names .amp{display:inline-block;color:#f0f0f1;font-style:italic;margin:0 .1em}
.flourish{margin-top:15px;color:#c99431;font-size:clamp(15px,3.8vw,23px);letter-spacing:.08em}
.curtain{position:absolute;z-index:12;top:0;height:100%;width:51%;overflow:hidden;will-change:transform,clip-path;background:
linear-gradient(115deg,rgba(255,255,255,.08),transparent 18% 75%,rgba(255,225,145,.07)),
repeating-linear-gradient(96deg,#100b07 0 7%,#26190b 9%,#815615 13%,#d7a441 16%,#fff0a1 18%,#93631c 22%,#25180a 27%);
box-shadow:inset 0 0 90px rgba(0,0,0,.7),0 0 28px #000}
.left{left:0;transform-origin:0 0}.right{right:0;transform-origin:100% 0}
.left.open{animation:liftLeft 2.7s cubic-bezier(.62,0,.15,1) forwards}
.right.open{animation:liftRight 2.7s cubic-bezier(.62,0,.15,1) forwards}
.valance{position:absolute;z-index:16;left:0;top:-42px;width:100%;height:150px;pointer-events:none}
.swag{position:absolute;top:0;height:112px;border-radius:0 0 60% 60%;background:radial-gradient(ellipse at 50% 100%,#e2ad46,#68420e 43%,#171008 80%);border-bottom:2px solid #e2b353;box-shadow:0 8px 18px rgba(0,0,0,.55)}
.s1{left:-8%;width:43%;transform:rotate(5deg)}.s2{left:29%;width:42%}.s3{right:-8%;width:43%;transform:rotate(-5deg)}
.particles,.balloons{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.star{position:absolute;color:var(--c);font-size:var(--s);opacity:0;text-shadow:0 0 8px currentColor,0 0 18px currentColor;animation:twinkle var(--t) var(--d) ease-in-out infinite}
.balloon{position:absolute;bottom:-100px;width:var(--s);height:calc(var(--s)*1.23);border-radius:50% 50% 46% 46%;opacity:0;background:radial-gradient(circle at 30% 25%,#fff,var(--c) 35%,rgba(74,47,10,.76) 100%);box-shadow:inset -6px -7px 10px rgba(0,0,0,.2),0 0 14px rgba(255,219,112,.16);animation:floatUp var(--t) var(--d) ease-in forwards}
.balloon:after{content:"";position:absolute;left:50%;top:103%;height:60px;width:1px;background:rgba(235,229,213,.45)}
.loading{position:absolute;z-index:8;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);font-family:Arial,sans-serif;color:#d9d5cc;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.error{display:none;position:absolute;z-index:30;inset:0;padding:30px;place-items:center;text-align:center;background:#090705;color:#f3dfaa;font-family:Arial,sans-serif}
.error.show{display:grid}
@keyframes liftLeft{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-104%,-12%) scale(.58)}}
@keyframes liftRight{0%{transform:translate(0,0) scale(1)}100%{transform:translate(104%,-12%) scale(.58)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55)}50%{opacity:1;transform:scale(1.25) rotate(25deg)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}12%{opacity:.92}100%{opacity:.08;transform:translateY(-118vh) translateX(var(--drift))}}
@media(max-width:600px){.content{width:69vw;top:47%}.names{font-size:clamp(16px,4.25vw,25px)}.title{font-size:clamp(41px,11.5vw,63px)}.valance{top:-34px;height:120px}.swag{height:90px}}
</style>
</head>
<body>
<div class="stage">
  <main class="content">
    <div class="emblem">
      <div class="crown">♛</div>
      <span class="ring r1"></span><span class="ring r2"></span>
      <span class="heart">♥</span>
    </div>
    <div class="kicker">WELCOME TO</div>
    <h1 class="title">WEDDING</h1>
    <div class="names">NEHEMIA <span class="amp">&amp;</span> FANOMEZANA</div>
    <div class="flourish">──── ❦ ────</div>
  </main>

  <div class="particles" id="stars"></div>
  <div class="balloons" id="balloons"></div>

  <div class="curtain left" id="leftCurtain"></div>
  <div class="curtain right" id="rightCurtain"></div>

  <div class="valance"><div class="swag s1"></div><div class="swag s2"></div><div class="swag s3"></div></div>
  <div class="loading">Preparing something beautiful…</div>
  <div class="error" id="error">QR / SITE CODE TSY FANTATRA</div>
</div>

<script>
(function(){
"use strict";

const SITES = {
  "01": "https://sites.google.com/view/bebesynyraitapo/accueil",
  "02": "https://sites.google.com/view/pastorlivasynyzanany/accueil",
  "03": "https://sites.google.com/view/dadato-lucien-sy-ny-zanany/accueil",
  "04": "https://sites.google.com/view/prinesynyzanany/accueil",
  "05": "https://sites.google.com/view/dadatofidelsynyzanany/accueil",
  "06": "https://sites.google.com/view/dadato-maurice/accueil",
  "07": "https://sites.google.com/view/dadanaivosynyzanany/accueil",
  "08": "https://sites.google.com/view/helenesynyzanany/accueil",
  "09": "https://sites.google.com/view/dadatoclaudesynyzanany/accueil",
  "10": "https://sites.google.com/view/fafaramivady/accueil",
  "11": "https://sites.google.com/view/laza-sy-ny-zanany/accueil",
  "12": "https://sites.google.com/view/tsoasynyzanany/accueil",
  "13": "https://sites.google.com/view/totomilena/accueil",
  "14": "https://sites.google.com/view/lalasoa-sy-ny-zanany/accueil",
  "15": "https://sites.google.com/view/dadatoleonsynyzanany/accueil"
};

const params = new URLSearchParams(window.location.search);
const code = (params.get("site") || "01").padStart(2,"0");
const TARGET = SITES[code];

if(!TARGET){
  document.getElementById("error").classList.add("show");
  return;
}

const left=document.getElementById("leftCurtain");
const right=document.getElementById("rightCurtain");
const stars=document.getElementById("stars");
const balloons=document.getElementById("balloons");
const colors=["#e5b34b","#ffe9a3","#e5e7eb","#ffffff"];

function star(i){
 const e=document.createElement("span"); e.className="star";
 e.textContent=["✦","★","✧","⋆"][i%4];
 e.style.left=(4+Math.random()*92)+"%";
 e.style.top=(11+Math.random()*76)+"%";
 e.style.setProperty("--c",colors[i%colors.length]);
 e.style.setProperty("--s",(8+Math.random()*18)+"px");
 e.style.setProperty("--t",(1.3+Math.random()*2.3)+"s");
 e.style.setProperty("--d",(1.7+Math.random()*1.5)+"s");
 stars.appendChild(e);
}

function balloon(i){
 const e=document.createElement("span"); e.className="balloon";
 e.style.left=(4+Math.random()*88)+"%";
 e.style.setProperty("--c",colors[i%colors.length]);
 e.style.setProperty("--s",(22+Math.random()*28)+"px");
 e.style.setProperty("--t",(4.0+Math.random()*1.8)+"s");
 e.style.setProperty("--d",(2.0+Math.random()*1.2)+"s");
 e.style.setProperty("--drift",(-55+Math.random()*110)+"px");
 balloons.appendChild(e);
}

for(let i=0;i<42;i++)star(i);
for(let i=0;i<15;i++)balloon(i);

setTimeout(function(){
 left.classList.add("open");
 right.classList.add("open");
},650);

setTimeout(function(){
 window.location.replace(TARGET);
},7800);

})();
</script>
</body>
</html>
