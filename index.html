  </div>


  <div class="particles" id="particles"></div>


  <div class="curtain left">

    <div class="fabric"></div>

    <div class="tie">
      <div class="medallion">✦</div>
      <div class="tassel"></div>
    </div>

  </div>

      <div class="tassel"></div>
    </div>

  </div>

    <div class="swag s1"></div>

    <div class="swag s3"></div>
  </div>

    ENTER
  </button>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const left =
    document.querySelector(".curtain.left");

  const right =
    document.querySelector(".curtain.right");

  const box =
    document.getElementById("particles");

  const skip =
    document.getElementById("skip");


  /*
  ==========================
  OUVERTURE RIDEAUX
  ==========================
  */

  setTimeout(function () {

    if (left) {

      left.animate(

        [
          {
            transform:
              "translateX(0) scaleX(1)"
          },

          {
            transform:
              "translateX(-27%) scaleX(.84)"
          },

          {
            transform:
              "translateX(-50%) scaleX(.58) rotate(-2deg)"
          }
        ],

        {
          duration: 2500,

          easing:
            "cubic-bezier(.64,0,.18,1)",

          fill: "forwards"
        }

      );

    }


    if (right) {

      right.animate(

        [
          {
            transform:
              "translateX(0) scaleX(1)"
          },

          {
            transform:
              "translateX(27%) scaleX(.84)"
          },

          {
            transform:
              "translateX(50%) scaleX(.58) rotate(2deg)"
          }
        ],

        {
          duration: 2500,

          easing:
            "cubic-bezier(.64,0,.18,1)",

          fill: "forwards"
        }

      );

    }

  }, 700);



  /*
  ==========================
  KINTANA SY BALLON
  ==========================
  */

  function particle(type, i) {

    if (!box) return;


    const e =
      document.createElement("div");


    e.className = type;


    if (type === "star") {

      e.textContent =
        ["★", "✦", "✧", "⋆"][i % 4];

    }


    const palette = [

      "#e8b23c",

      "#ffe7a1",

      "#d9dadd",

      "#ffffff"

    ];


    e.style.setProperty(

      "--c",

      palette[i % palette.length]

    );


    e.style.setProperty(

      "--size",

      type === "star"

        ? (12 + Math.random() * 24) + "px"

        : (20 + Math.random() * 24) + "px"

    );


    e.style.setProperty(

      "--dur",

      (3.5 + Math.random() * 2) + "s"

    );


    e.style.setProperty(

      "--delay",

      (1.9 + Math.random()) + "s"

    );


    e.style.setProperty(

      "--drift",

      (-50 + Math.random() * 100) + "px"

    );


    e.style.setProperty(

      "--rot",

      (-90 + Math.random() * 180) + "deg"

    );


    e.style.left =

      (4 + Math.random() * 92) + "%";


    box.appendChild(e);

  }



  /*
  KINTANA GOLDEN + SILVER
  */

  for (let i = 0; i < 26; i++) {

    particle("star", i);

  }



  /*
  BALLON GOLDEN + SILVER
  */

  for (let i = 0; i < 12; i++) {

    particle("balloon", i);

  }



  /*
  ==========================
  GOOGLE SITES REDIRECT
  ==========================
  */

  let going = false;


  function go() {

    if (going) return;


    going = true;


    window.location.href =

      "https://sites.google.com/view/bebesynyraitapo/accueil";

  }



  /*
  Bouton ENTER
  */

  if (skip) {

    skip.addEventListener(
      "click",
      go
    );

  }



  /*
  Redirect automatique
  */

  setTimeout(
    go,
    7500
  );

});

</script>
