<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#120b06" />
  <title>Wedding Nehemia & Fanomezana</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" aria-label="Wedding welcome animation">
    <div class="ambient ambient-1"></div>
    <div class="ambient ambient-2"></div>

    <div class="backdrop">
      <div class="monogram" aria-hidden="true">
        <div class="ring ring-left"></div>
        <div class="ring ring-right"></div>
        <div class="sparkle s1">✦</div>
        <div class="sparkle s2">✧</div>
        <div class="sparkle s3">✦</div>
      </div>

      <div class="welcome-card">
        <div class="ornament">❦</div>
        <p class="eyebrow">WELCOME TO WEDDING</p>
        <h1>NEHEMIA <span>&amp;</span> FANOMEZANA</h1>
        <p class="date-line">A beautiful beginning</p>
        <div class="divider"><i></i><b>◆</b><i></i></div>
        <p class="entering">Opening your invitation…</p>
      </div>
    </div>

    <div class="curtain curtain-left">
      <div class="folds"></div>
      <div class="tie tie-left"><span></span></div>
    </div>
    <div class="curtain curtain-right">
      <div class="folds"></div>
      <div class="tie tie-right"><span></span></div>
    </div>

    <div class="top-drape">
      <div class="swag swag-1"></div>
      <div class="swag swag-2"></div>
      <div class="swag swag-3"></div>
      <div class="gold-trim"></div>
    </div>

    <div class="flash"></div>
    <div class="vignette"></div>

    <button id="enterBtn" class="enter-btn" type="button">ENTER WEDDING</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
