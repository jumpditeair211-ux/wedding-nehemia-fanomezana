<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Nehemia & Fanomezana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="backdrop"></div>

  <div class="center-content">
    <div class="rings"><span></span><span></span><b>♥</b></div>
    <div class="small">WELCOME TO</div>
    <div class="wedding">WEDDING</div>
    <div class="names">NEHEMIA <em>&amp;</em> FANOMEZANA</div>
    <div class="flourish">──── ❦ ────</div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="curtain left">
    <div class="fabric"></div>
    <div class="tie"><div class="medallion">✦</div><div class="tassel"></div></div>
  </div>

  <div class="curtain right">
    <div class="fabric"></div>
    <div class="tie"><div class="medallion">✦</div><div class="tassel"></div></div>
  </div>

  <div class="top-swag">
    <div class="swag s1"></div>
    <div class="swag s2"></div>
    <div class="swag s3"></div>
  </div>

  <button id="skip">ENTER</button>
</div>

<script src="script.js"></script>
</body>
</html>
